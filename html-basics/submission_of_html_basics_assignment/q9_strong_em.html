<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Strong and Em Example</title>
</head>
<body>

    <!-- Sentence with both strong and em emphasizing different parts -->
    <p>
        Consistency is <strong>extremely important</strong> when preparing
        for placements, and staying <em>patient</em> throughout the journey
        matters just as much.
    </p>

</body>
</html>
