<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Span Elements Example</title>
</head>
<body>

    <!-- Paragraph using three span elements to label different parts of text -->
    <p>
        My preparation plan includes
        <span title="Core Subject">Data Structures and Algorithms</span>,
        <span title="Backend Skill">Java with Spring Boot</span>, and
        <span title="Frontend Skill">HTML, CSS, and JavaScript</span>.
    </p>

</body>
</html>
