<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hyperlink Example</title>
</head>
<body>

    <!-- Hyperlink to Google, opens in a new tab using target="_blank" -->
    <!-- rel="noopener noreferrer" is added for security best practice -->
    <p>
        Click here to visit
        <a href="https://www.google.com" target="_blank" rel="noopener noreferrer">Google Search</a>
    </p>

</body>
</html>
