<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inline Formatting Demo</title>
</head>
<body>

    <!-- Creative paragraph combining strong, em, mark, small, and br -->
    <p>
        Today was a <strong>productive</strong> day of preparation.<br>
        I solved array problems that felt <em>challenging</em> at first,
        but the <mark>sliding window technique</mark> made things easier.
        <br>
        <small>Logged in my daily tracker</small>
    </p>

</body>
</html>
