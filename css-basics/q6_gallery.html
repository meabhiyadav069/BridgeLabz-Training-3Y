<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="q6_style.css">
</head>
<body>

    <header>
        <h1>Travel Gallery</h1>
    </header>

    <main class="gallery">
        <div class="photo">
            <img src="photo1.jpg" alt="Mountain view">
            <div class="caption">Himalayan Peaks</div>
        </div>
        <div class="photo">
            <img src="photo2.jpg" alt="Beach sunset">
            <div class="caption">Goa Sunset</div>
        </div>
        <div class="photo">
            <img src="photo3.jpg" alt="City skyline">
            <div class="caption">Mumbai Skyline</div>
        </div>
        <div class="photo">
            <img src="photo4.jpg" alt="Desert dunes">
            <div class="caption">Jaisalmer Dunes</div>
        </div>
        <div class="photo">
            <img src="photo5.jpg" alt="Forest trail">
            <div class="caption">Western Ghats</div>
        </div>
        <div class="photo">
            <img src="photo6.jpg" alt="River view">
            <div class="caption">Ganges at Varanasi</div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Photo Gallery</p>
    </footer>

</body>
</html>
