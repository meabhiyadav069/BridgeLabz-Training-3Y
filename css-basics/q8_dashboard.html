<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link rel="stylesheet" href="q8_style.css">
</head>
<body>

    <!-- Fixed header -->
    <header class="dash-header">
        <h1>Admin Dashboard</h1>
    </header>

    <div class="dash-body">
        <!-- Sidebar -->
        <aside class="sidebar">
            <nav>
                <a href="#">Overview</a>
                <a href="#">Projects</a>
                <a href="#">Tasks</a>
                <a href="#">Reports</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <!-- Main content -->
        <main class="content">
            <div class="content-box">
                <h2>Active Projects</h2>
                <p>You currently have 4 active projects in progress across the team.</p>
            </div>
            <div class="content-box">
                <h2>Pending Tasks</h2>
                <p>12 tasks are due this week. 3 are marked high priority.</p>
            </div>
        </main>
    </div>

</body>
</html>
