<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Report</title>
</head>
<body>

    <!-- School name -->
    <h1>Greenwood Public School</h1>

    <main>
        <h2>Student Report Card</h2>

        <table border="1" title="Marks Table">
            <tr>
                <th>Subject</th>
                <th>Marks Obtained</th>
                <th>Maximum Marks</th>
            </tr>
            <tr>
                <td>Mathematics</td>
                <td>88</td>
                <td>100</td>
            </tr>
            <tr>
                <td>Physics</td>
                <td>82</td>
                <td>100</td>
            </tr>
            <tr>
                <td>Chemistry</td>
                <td>79</td>
                <td>100</td>
            </tr>
            <tr>
                <td>Computer Science</td>
                <td>95</td>
                <td>100</td>
            </tr>
            <tr>
                <td>English</td>
                <td>85</td>
                <td>100</td>
            </tr>

            <!-- Total and Percentage row using colspan -->
            <tr>
                <td colspan="2" title="Sum of all subject marks">Total</td>
                <td>429 / 500</td>
            </tr>
            <tr>
                <td colspan="2" title="Percentage calculated from total marks">Percentage</td>
                <td>85.8%</td>
            </tr>
        </table>
    </main>

    <footer>
        <p>&copy; 2026 Greenwood Public School</p>
    </footer>

</body>
</html>
