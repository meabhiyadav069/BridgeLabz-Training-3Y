<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dropdown Selection</title>
</head>
<body>

    <header>
        <h1>Travel Preference Selector</h1>
    </header>

    <main>
        <form>
            <!-- Country dropdown -->
            <label for="country">Country:</label>
            <select id="country" name="country">
                <option value="india" selected>India</option>
                <option value="usa">USA</option>
                <option value="japan">Japan</option>
            </select><br><br>

            <!-- State dropdown -->
            <label for="state">State:</label>
            <select id="state" name="state">
                <option value="up" selected>Uttar Pradesh</option>
                <option value="maharashtra">Maharashtra</option>
                <option value="rajasthan">Rajasthan</option>
            </select><br><br>

            <!-- City dropdown -->
            <label for="city">City:</label>
            <select id="city" name="city">
                <option value="mathura" selected>Mathura</option>
                <option value="lucknow">Lucknow</option>
                <option value="agra">Agra</option>
            </select><br><br>

            <!-- Favorite Tourist Place dropdown -->
            <label for="place">Favorite Tourist Place:</label>
            <select id="place" name="place">
                <option value="tajmahal" selected>Taj Mahal</option>
                <option value="krishnajanmabhoomi">Krishna Janmabhoomi</option>
                <option value="redfort">Red Fort</option>
            </select>
        </form>

        <!-- Summary paragraph -->
        <p>Based on the selections above, the chosen location is Mathura, Uttar Pradesh, India, with Taj Mahal as the favorite tourist place.</p>
    </main>

    <footer>
        <p>&copy; 2026 Travel Preferences</p>
    </footer>

</body>
</html>
